aid: skyselect
name: SkySelect
description: >-
  SkySelect is an AI-powered aircraft parts procurement platform for airlines,
  MROs (maintenance, repair and overhaul providers), and aircraft lessors.
  Founded in 2017 and headquartered in San Francisco, it operates an
  eProcurement-as-a-Service platform that automates sourcing, purchasing, and
  order tracking for aviation materials. Rather than a listings-based
  marketplace, buyers submit a demand list and SkySelect's specialised
  procurement AI automatically issues RFQs to a global network of 3,000+
  verified suppliers, having processed more than US$6 billion in transactions.
  The platform exposes an integration API (inventory sync, RFQ reception, and
  quote submission) gated behind account login; partners such as Rotabull
  connect via API Key and Secret credentials generated in Developer Settings.
  SkySelect is backed by Initialized Capital and raised US$9M in 2026.
